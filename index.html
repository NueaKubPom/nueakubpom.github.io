<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5fa">
  <meta name="description" content="เว็บไซต์ bueakubpom.github.io ย้ายไปให้บริการที่ nkpntsto.qzz.io แล้ว">
  <title>ย้ายบ้านใหม่แล้ว — nueakubpom.github.io</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Leelawadee UI", Tahoma, sans-serif;
      color: #472b3b;
      background: #fff5fa;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 28px 18px;
      background:
        radial-gradient(ellipse at 12% 18%, #ffe0ee 0, transparent 34%),
        radial-gradient(ellipse at 88% 82%, #f8d7f0 0, transparent 32%),
        #fff8fb;
    }

    .page {
      position: relative;
      width: min(100%, 620px);
      padding: clamp(32px, 8vw, 64px) clamp(24px, 7vw, 58px);
      overflow: hidden;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(238, 157, 194, 0.32);
      border-radius: 30px;
      box-shadow: 0 24px 70px rgba(180, 91, 135, 0.14);
      backdrop-filter: blur(12px);
    }

    .page::before,
    .page::after {
      position: absolute;
      z-index: 0;
      width: 150px;
      height: 150px;
      content: "";
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 202, 224, 0.5), rgba(255, 232, 241, 0));
      pointer-events: none;
    }

    .page::before {
      top: -75px;
      left: -68px;
    }

    .page::after {
      right: -72px;
      bottom: -82px;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      color: #b34d7d;
      background: #fff0f6;
      border: 1px solid #f8d6e5;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .icon {
      display: grid;
      width: 88px;
      height: 88px;
      margin: 26px auto 20px;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #f58bb7, #d95f9a);
      border: 7px solid #fff0f6;
      border-radius: 28px;
      box-shadow: 0 12px 26px rgba(217, 95, 154, 0.24);
      font-size: 2.4rem;
      transform: rotate(-5deg);
    }

    h1 {
      margin: 0;
      color: #482b3d;
      font-size: clamp(1.8rem, 6vw, 2.55rem);
      letter-spacing: -0.04em;
      line-height: 1.3;
    }

    .intro {
      max-width: 430px;
      margin: 15px auto 0;
      color: #796675;
      font-size: 1.04rem;
      line-height: 1.85;
    }

    .address {
      display: inline-block;
      margin-top: 20px;
      padding: 11px 18px;
      color: #b34d7d;
      background: #fff7fa;
      border: 1px dashed #e9a6c3;
      border-radius: 12px;
      font-size: 1.12rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .button {
      display: inline-flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
      padding: 0 25px;
      color: #fff;
      background: linear-gradient(110deg, #e879a8, #cc5791);
      border-radius: 15px;
      box-shadow: 0 10px 24px rgba(204, 87, 145, 0.28);
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .button:hover {
      box-shadow: 0 14px 28px rgba(204, 87, 145, 0.36);
      transform: translateY(-2px);
    }

    .button:focus-visible {
      outline: 3px solid #a93c76;
      outline-offset: 4px;
    }

    .note {
      margin: 24px 0 0;
      color: #9a8794;
      font-size: 0.88rem;
      line-height: 1.7;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
      <div class="badge"><span aria-hidden="true">✦</span> แจ้งย้ายเว็บไซต์</div>
      <div class="icon" aria-hidden="true">⌂</div>
      <h1>เราย้ายบ้านใหม่แล้ว!</h1>
      <p class="intro">
        เว็บไซต์ <strong>nueakubpom.github.io</strong> ปิดให้บริการที่นี่แล้วนะครับ<br>
        ย้ายไปพบกันต่อได้ที่เว็บไซต์ใหม่ของเรา
      </p>
      <div class="address">nkpntsto.qzz.io</div>
      <div>
        <a class="button" href="https://nkpntsto.qzz.io/">
          ไปยังเว็บไซต์ใหม่ <span aria-hidden="true">→</span>
        </a>
      </div>
      <p class="note">ขอบคุณที่ติดตามและแวะมาเยี่ยมชมกันเสมอ 💗</p>
    </div>
  </main>
</body>
</html>
